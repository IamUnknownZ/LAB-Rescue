*{box-sizing:border-box;scrollbar-color:var(--scrollbar-thumb) var(--scrollbar-track);scrollbar-width:thin}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-track{background:var(--scrollbar-track)}*::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border:2px solid var(--scrollbar-track)}*::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-hover)}*::-webkit-scrollbar-thumb:active{background:var(--scrollbar-active)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65}
button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer;color:var(--ink)}button:disabled{cursor:not-allowed;opacity:.55}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
a{color:inherit}button{touch-action:manipulation}svg{display:block}svg.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:square;stroke-linejoin:miter}
button,.panel,.field input{border-radius:var(--radius)}h1,h2,h3,p{margin-top:0}h1,h2,h3{line-height:1.3}p{margin-bottom:1rem}button svg{pointer-events:none}#app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{height:88px;border-bottom:var(--line);display:flex;align-items:center;gap:24px;padding:0 4vw;background:var(--paper);z-index:10}
.brand{border:0;background:none;display:flex;align-items:center;gap:11px;padding:0;text-align:left;flex-shrink:0}
.brand-mark{width:47px;height:45px;border:var(--line);background:var(--yellow);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center}
.brand-mark svg{width:32px;height:32px;stroke:var(--ink);stroke-width:2.6;fill:none}.brand>span:last-child{font:900 20px/.96 var(--font-display);letter-spacing:-1px}.brand>span:last-child>span{display:block;margin-top:5px}
.top-subtitle{border-left:2px solid var(--ink);padding-left:24px;font-size:14px;font-weight:700}.top-subtitle>span{display:block;font:11px/1.6 ui-monospace,monospace;letter-spacing:1.4px}
.topbar nav{margin-left:auto;display:flex;gap:10px;align-items:center}.nav-btn{border:0;background:transparent;min-height:44px;padding:8px 13px;font-size:14px;font-weight:700}.nav-btn:hover{background:var(--yellow)}
.icon-btn{border:2px solid var(--ink);background:var(--paper);width:44px;height:44px;display:grid;place-items:center;box-shadow:2px 2px 0 var(--ink)}.icon-btn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.3}.icon-btn:hover{background:var(--cyan)}
main{flex:1;width:100%;outline:0}main:focus{outline:0}.app-footer{border-top:var(--line);min-height:45px;display:flex;align-items:center;justify-content:space-between;padding:8px 4vw;gap:16px;font-size:11px;font-weight:700;letter-spacing:.3px}
.sync-indicator{border:0;background:none;font:inherit;display:flex;align-items:center;gap:7px;padding:3px 0;min-height:26px;text-align:right}.sync-indicator:before{content:"";width:8px;height:8px;background:var(--cyan);border:1.5px solid var(--ink);border-radius:50%;flex-shrink:0}.sync-indicator[data-status=pending]:before,.sync-indicator[data-status=offline]:before{background:var(--yellow)}.sync-indicator[data-status=error]:before{background:var(--pink)}
.home{max-width:1500px;margin:0 auto;padding:40px 4vw 30px;display:grid;grid-template-columns:.84fr 1.3fr;gap:40px;align-items:center;min-height:calc(100dvh - 136px)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:700 12px/1.5 ui-monospace,monospace;letter-spacing:1px}.eyebrow-label{padding:7px 10px;background:var(--ink);color:var(--paper);transform:rotate(-2deg);margin-bottom:20px}.tiny-square{width:8px;height:8px;background:var(--yellow);display:inline-block}
.hero-title{font:900 clamp(50px,6.4vw,96px)/.94 var(--font-display);letter-spacing:-5px;margin:0 0 20px}.hero-title .highlight{display:inline-block;background:var(--yellow);padding:3px 13px 12px;border:var(--line);box-shadow:5px 5px 0 var(--ink);transform:rotate(-2deg);margin-top:8px;letter-spacing:-4px}
.hero-thai{font-weight:800;font-size:25px;line-height:1.55;margin:25px 0 8px}.hero-desc{max-width:400px;font-size:15px;color:var(--muted);line-height:1.85}.hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin:22px 0}
.btn{min-height:48px;padding:11px 20px;border:var(--line);background:var(--paper);font-weight:800;line-height:1.4;display:inline-flex;align-items:center;justify-content:center;gap:12px;box-shadow:4px 4px 0 var(--ink);transition:transform .12s,box-shadow .12s}.btn:hover:enabled{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}.btn:active:enabled{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}.btn-primary{background:var(--yellow)}.btn-cyan{background:var(--cyan)}.btn-pink{background:var(--pink)}.btn-lime{background:var(--lime)}.btn-dark{background:var(--ink);color:var(--paper)}.btn-plain{box-shadow:none;background:transparent;border-width:2px}.btn-lg{min-height:58px;font-size:18px;padding:13px 25px}.btn-wide{width:100%}.btn-small{padding:8px 12px;min-height:42px;font-size:13px}.btn svg{width:21px;height:21px}.hero-note{font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px}
